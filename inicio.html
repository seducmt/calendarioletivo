function filtrar() {
    const busca = document.getElementById('campoBusca').value.toLowerCase();
    const resultDiv = document.getElementById('resultado');
    
    if (busca.length < 2) {
        resultDiv.innerHTML = "";
        return;
    }

    const filtrados = alunos.filter(a => a.n.toLowerCase().includes(busca));

    if (filtrados.length === 0) {
        resultDiv.innerHTML = "<div class='no-result'>Nenhum aluno encontrado com este nome.</div>";
    } else {
        resultDiv.innerHTML = filtrados.map(a => `
            <div class="aluno-item">
                <span class="aluno-nome">${a.n}</span>
                <span class="turma-tag">${a.t}</span>
            </div>
        `).join('');
    }
}
